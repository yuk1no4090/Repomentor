<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Repomentor banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>

  <!-- soft decorative bubbles -->
  <circle cx="1060" cy="52" r="90" fill="#ffffff" opacity="0.06"/>
  <circle cx="920" cy="250" r="60" fill="#ffffff" opacity="0.05"/>
  <circle cx="330" cy="30" r="40" fill="#ffffff" opacity="0.06"/>

  <!-- floating glyphs -->
  <g fill="#ffffff" opacity="0.35" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="26" font-weight="700">
    <text x="640" y="60">{ }</text>
    <text x="1105" y="150">&lt;/&gt;</text>
    <text x="700" y="272">()=&gt;</text>
  </g>
  <g fill="#fde68a" opacity="0.9">
    <path d="M1046 205 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 z"/>
    <path d="M600 235 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z" opacity="0.7"/>
  </g>

  <!-- ============ mascot robot ============ -->
  <g transform="translate(70,44)">
    <!-- shadow -->
    <ellipse cx="105" cy="212" rx="78" ry="10" fill="#312e81" opacity="0.35"/>
    <!-- antenna -->
    <line x1="105" y1="22" x2="105" y2="44" stroke="#c7d2fe" stroke-width="6" stroke-linecap="round"/>
    <circle cx="105" cy="16" r="10" fill="#fbbf24"/>
    <circle cx="105" cy="16" r="16" fill="#fbbf24" opacity="0.25"/>
    <!-- head -->
    <rect x="55" y="44" width="100" height="78" rx="24" fill="#eef2ff"/>
    <!-- face screen -->
    <rect x="67" y="58" width="76" height="50" rx="16" fill="#4338ca"/>
    <!-- eyes -->
    <circle cx="90" cy="80" r="9" fill="#ffffff"/>
    <circle cx="120" cy="80" r="9" fill="#ffffff"/>
    <circle cx="92" cy="82" r="4" fill="#312e81"/>
    <circle cx="122" cy="82" r="4" fill="#312e81"/>
    <!-- smile -->
    <path d="M97 94 Q105 101 113 94" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- blush -->
    <ellipse cx="76" cy="92" rx="6" ry="4" fill="#f9a8d4" opacity="0.8"/>
    <ellipse cx="134" cy="92" rx="6" ry="4" fill="#f9a8d4" opacity="0.8"/>
    <!-- ears -->
    <rect x="43" y="70" width="12" height="26" rx="6" fill="#c7d2fe"/>
    <rect x="155" y="70" width="12" height="26" rx="6" fill="#c7d2fe"/>
    <!-- body -->
    <rect x="63" y="128" width="84" height="66" rx="20" fill="#eef2ff"/>
    <!-- chest: open book (reading the repo) -->
    <g transform="translate(83,146)">
      <path d="M0 6 Q11 -2 22 6 L22 30 Q11 23 0 30 Z" fill="#4f46e5"/>
      <path d="M22 6 Q33 -2 44 6 L44 30 Q33 23 22 30 Z" fill="#7c3aed"/>
      <line x1="6" y1="12" x2="17" y2="10" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="18" x2="17" y2="16" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round"/>
      <line x1="27" y1="10" x2="38" y2="12" stroke="#ddd6fe" stroke-width="2" stroke-linecap="round"/>
      <line x1="27" y1="16" x2="38" y2="18" stroke="#ddd6fe" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- left arm waving -->
    <path d="M63 142 Q34 130 30 106" stroke="#eef2ff" stroke-width="14" fill="none" stroke-linecap="round"/>
    <circle cx="30" cy="102" r="11" fill="#eef2ff"/>
    <!-- right arm holding magnifier -->
    <path d="M147 150 Q176 158 186 142" stroke="#eef2ff" stroke-width="14" fill="none" stroke-linecap="round"/>
    <g transform="translate(186,112)">
      <circle cx="14" cy="14" r="17" fill="url(#screen)" stroke="#fbbf24" stroke-width="6"/>
      <text x="7" y="21" font-family="ui-monospace, Consolas, monospace" font-size="16" font-weight="700" fill="#4f46e5">?</text>
      <line x1="26" y1="28" x2="38" y2="42" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    </g>
    <!-- legs -->
    <rect x="76" y="194" width="16" height="16" rx="7" fill="#c7d2fe"/>
    <rect x="118" y="194" width="16" height="16" rx="7" fill="#c7d2fe"/>
  </g>

  <!-- ============ text ============ -->
  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="360" y="122" font-size="56" font-weight="800" fill="#ffffff">Repomentor</text>
    <text x="362" y="158" font-size="21" fill="#e0e7ff">AI Developer Onboarding Copilot — cited answers, impact briefings &amp; a quality dashboard you can audit.</text>
    <!-- capability chips -->
    <g font-size="16" font-weight="600">
      <rect x="362" y="188" width="150" height="34" rx="17" fill="#ffffff" opacity="0.16"/>
      <text x="380" y="210" fill="#ffffff">RAG + Citations</text>
      <rect x="524" y="188" width="160" height="34" rx="17" fill="#ffffff" opacity="0.16"/>
      <text x="542" y="210" fill="#ffffff">LangGraph Agents</text>
      <rect x="696" y="188" width="152" height="34" rx="17" fill="#ffffff" opacity="0.16"/>
      <text x="714" y="210" fill="#ffffff">HITL Guardrails</text>
      <rect x="860" y="188" width="128" height="34" rx="17" fill="#ffffff" opacity="0.16"/>
      <text x="878" y="210" fill="#ffffff">Built-in Evals</text>
      <rect x="1000" y="188" width="120" height="34" rx="17" fill="#ffffff" opacity="0.16"/>
      <text x="1018" y="210" fill="#ffffff">MCP Server</text>
    </g>
    <text x="362" y="252" font-size="15" fill="#c7d2fe">Zero API key required · 237 unit tests · 34 static gates · 9 black-box suites</text>
  </g>
</svg>
