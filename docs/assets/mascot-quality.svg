  <rect x="130" y="178" width="14" height="14" rx="6" fill="#c4b5fd"/>

  <path d="M198 44 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z" fill="#34d399" opacity="0.85"/>
  <path d="M36 150 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#fbbf24" opacity="0.9"/>
